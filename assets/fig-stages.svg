.accepted{fill:#1f2328}
.invalid{fill:#9aa1ab}
.held{fill:#ffffff}
.answer-key{fill:url(#hatch)}
.hatch-page{fill:#ffffff}
.hatch-line{stroke:#656d76;stroke-width:1.6}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.soft{fill:#c9d1d9}
.mute{fill:#9198a1}
.page{fill:#0d1117}
.grid{stroke:#2a3038}
.axis{stroke:#d0d7de}
.bar{stroke:#d0d7de}
.whisker{stroke:#e6edf3}
.direct{fill:#68717d}
.guided{fill:#343b44}
.partial{fill:#24405f}
.staged{fill:#5b9bf0}
