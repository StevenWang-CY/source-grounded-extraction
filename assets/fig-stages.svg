<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img">
<desc>Workflow variants on the 66 test cases: Direct, 21 of 28 review/reject cases accepted, 38 of 66 correct decisions; Direct&#x27;s candidate + Python, 9 of 28 review/reject cases accepted, 51 of 66 correct decisions; Staged extraction + Python, 3 of 28 review/reject cases accepted, 55 of 66 correct decisions; Full staged workflow, 2 of 28 review/reject cases accepted, 55 of 66 correct decisions; Answer-key candidate, 2 of 28 review/reject cases accepted, 63 of 66 correct decisions</desc>
<style>@font-face{font-family:'STIX Two Text';src:url(data:font/woff;base64,) format('woff')}
svg{font-family:'STIX Two Text',serif;font-size:21px}
text{fill:#1f2328}
.soft{fill:#3d444d}
.mute{fill:#656d76}
.page{fill:#ffffff}
.grid{stroke:#e3e7ee;stroke-width:1}
