<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 644" width="420" height="644" role="img">
<desc>Workflow variants on the 66 development cases, one group of rows per measure.</desc>
<style>@font-face{font-family:'STIX Two Text';src:url(data:font/woff;base64,) format('woff')}
svg{font-family:'STIX Two Text',serif;font-size:21px}
text{fill:#1f2328}
.soft{fill:#3d444d}
.mute{fill:#656d76}
.page{fill:#ffffff}
.grid{stroke:#e3e7ee;stroke-width:1}
.axis{stroke:#2b3138;stroke-width:1.2}
.bar{stroke:#2b3138;stroke-width:1.1}
.whisker{stroke:#1f2328;stroke-width:1.5}
.direct{fill:#b7bdc8}
.partial{fill:#c5d9f4}
.staged{fill:#3a7bd5}
.answer-key{fill:url(#hatch)}
.hatch-page{fill:#ffffff}
.hatch-line{stroke:#656d76;stroke-width:1.6}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.soft{fill:#c9d1d9}
.mute{fill:#9198a1}
.page{fill:#0d1117}
.grid{stroke:#2a3038}
.axis{stroke:#d0d7de}
.bar{stroke:#d0d7de}
.whisker{stroke:#e6edf3}
.direct{fill:#68717d}
.partial{fill:#24405f}
.staged{fill:#5b9bf0}
.hatch-page{fill:#0d1117}
.hatch-line{stroke:#9198a1}
}
</style>
