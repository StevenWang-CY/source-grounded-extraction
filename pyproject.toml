[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-extraction-study"
version = "0.1.0"
description = "A small study of source-grounded CRM extraction and verification"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["mlx-lm>=0.26,<0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
report = ["reportlab>=4,<5", "fonttools>=4.40,<5"]

[project.scripts]
crm-study = "crm_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
